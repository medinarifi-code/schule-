<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff7a3d" />
  <title>Schülerverkauf – Abstimmung</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥨</text></svg>" />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-emoji" aria-hidden="true">🥨</div>
      <h1>Schülerverkauf</h1>
      <p>Stimm ab, was es geben soll – und verrate uns deinen Wunsch für nächste Woche!</p>
    </div>
    <svg class="wave" viewBox="0 0 1440 80" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,40 C240,80 480,0 720,32 C960,64 1200,16 1440,40 L1440,80 L0,80 Z" />
    </svg>
  </header>

  <main class="container">
    <section class="card appear">
      <div class="card-head">
        <h2>🗳️ Abstimmung</h2>
        <span id="total-badge" class="badge" hidden><span id="total-num">0</span>&nbsp;Stimmen</span>
      </div>
      <p id="vote-status" class="status">Einen Moment…</p>
      <div id="products" class="product-list" aria-live="polite">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
    </section>

    <section class="card appear" style="--delay: 80ms">
      <div class="card-head">
        <h2>💡 Dein Wunsch</h2>
      </div>
      <p class="status">Was soll es nächste Woche geben?</p>
      <form id="wish-form">
        <div class="field">
          <textarea id="wish-text" maxlength="200" rows="3"
            placeholder="z. B. Muffins, Pizzabrötchen, Waffeln…" required></textarea>
          <span id="wish-count" class="counter">0 / 200</span>
        </div>
        <button type="submit" class="btn btn-block">
          <span>Wunsch senden</span> <span aria-hidden="true">✨</span>
        </button>
      </form>
    </section>
  </main>

  <footer>Keine Anmeldung nötig · 1 Stimme pro Gerät</footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
